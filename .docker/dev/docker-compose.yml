version: '3.8'

services:
  app:
    container_name: ${COMPOSE_PROJECT_NAME:-staticmaker}_app
    build:
      context: ../..
      target: dev
      dockerfile: .docker/dev/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
      - "5005:5005"
    environment:
      - TZ=${TIMEZONE:-UTC}
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE:-fflog}
      - DB_USERNAME=${MYSQL_USER:-fflog_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-fflog_password}
      - SHOW_SQL=${SHOW_SQL:-false}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - FFLOGS_CLIENT_ID=${FFLOGS_CLIENT_ID}
      - FFLOGS_CLIENT_SECRET=${FFLOGS_CLIENT_SECRET}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - staticmaker-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../src:/opt/app/src:cached
      - maven-cache:/root/.m2

  frontend:
    container_name: ${COMPOSE_PROJECT_NAME:-staticmaker}_frontend
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - app
    networks:
      - staticmaker-net
    environment:
      - REACT_APP_API_URL=http://localhost:8080

  database:
    image: mysql:${MYSQL_VERSION:-8.0}
    container_name: ${COMPOSE_PROJECT_NAME:-staticmaker}_database
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--default-authentication-plugin=mysql_native_password",
      "--disable-log-bin",
      "--innodb-buffer-pool-size=256MB"
    ]
    cap_add:
      - SYS_NICE
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      - TZ=${TIMEZONE:-UTC}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-fflog}
      - MYSQL_USER=${MYSQL_USER:-fflog_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-fflog_password}
    networks:
      - staticmaker-net
    volumes:
      - database-data:/var/lib/mysql:z
      - ../../.docker/dev/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  staticmaker-net:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-staticmaker}_network

volumes:
  database-data:
    name: ${COMPOSE_PROJECT_NAME:-staticmaker}_database_data
  maven-cache:
    name: ${COMPOSE_PROJECT_NAME:-staticmaker}_maven_cache
